services:
  postgres:
    image: postgres:16-alpine
    container_name: gabinete-plus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gabinete}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gabinete_local}
      POSTGRES_DB: ${POSTGRES_DB:-gabinete_plus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gabinete_plus_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gabinete} -d ${POSTGRES_DB:-gabinete_plus}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gabinete_plus_postgres:

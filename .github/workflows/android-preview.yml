name: Android validation APK
on:
  pull_request:
    paths: ['apps/mobile/**', 'packages/shared/**', 'pnpm-lock.yaml', '.github/workflows/android-preview.yml']
  workflow_dispatch:
concurrency:
  group: android-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PREVIEW_ALLOW_HTTP: 'true'
      NODE_ENV: production
      CI: '1'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm --filter @gabinete-plus/shared build
      - name: Generate native validation project
        run: pnpm --filter @gabinete-plus/mobile exec expo prebuild --platform android --no-install
      - name: Build standalone internal APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Record build identity and checksum
        run: |
          mkdir -p validation-apk
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk validation-apk/GabineteMais-validacao.apk
          printf 'Repository: %s\nCommit: %s\nPurpose: internal validation; debug signing key\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > validation-apk/BUILD.txt
          cd validation-apk
          sha256sum GabineteMais-validacao.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GabineteMais-validacao-${{ github.sha }}
          path: validation-apk/
          if-no-files-found: error
          retention-days: 30
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GabineteMais-validacao-${{ github.sha }}
          path: validation-apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify standalone startup on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install validation-apk/GabineteMais-validacao.apk
            adb logcat -c
            adb shell am start -W -n br.gabinetemais.prototipo/.MainActivity
            for attempt in $(seq 1 30); do
              adb shell uiautomator dump /sdcard/startup.xml
              adb pull /sdcard/startup.xml validation-apk/startup.xml
              if grep -q 'Endereço de acesso' validation-apk/startup.xml; then break; fi
              sleep 2
            done
            grep -q 'Endereço de acesso' validation-apk/startup.xml
            adb shell pidof br.gabinetemais.prototipo
            adb exec-out screencap -p > validation-apk/startup.png
            adb logcat -d -s AndroidRuntime:E ReactNativeJS:E > validation-apk/startup-errors.txt
            if grep -q 'FATAL EXCEPTION' validation-apk/startup-errors.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GabineteMais-abertura-Android35-${{ github.sha }}
          path: |
            validation-apk/startup.xml
            validation-apk/startup.png
            validation-apk/startup-errors.txt
          retention-days: 30

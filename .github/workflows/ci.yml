name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gabinete
          POSTGRES_PASSWORD: gabinete_local
          POSTGRES_DB: gabinete_plus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gabinete -d gabinete_plus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gabinete:gabinete_local@localhost:5432/gabinete_plus?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @gabinete-plus/api exec prisma migrate deploy
      - run: pnpm check

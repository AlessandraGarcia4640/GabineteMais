openapi: 3.1.0
info:
  title: Gabinete+ API
  version: 0.2.0
  description: |-
    API implementada de RF00–RF04: autenticação, equipe, atividades, checklists, contatos e tarefas. RF05 (orientações) e RF06 (transição) permanecem planejados e não possuem endpoints nesta versão. Interface local: /docs; contrato em /docs/openapi.json e /docs/openapi.yaml, habilitados em desenvolvimento/teste.

    Login retorna accessToken Bearer válido por 900 segundos e refreshToken opaco com prazo absoluto de sete dias. No botão Authorize informe apenas accessToken. Refresh/logout recebem refreshToken no corpo e não exigem Bearer. Renovação rotativa invalida o token anterior; reutilização revoga a sessão. Logout é idempotente. Sessão, atividade do usuário e perfil são consultados no banco a cada chamada protegida. Tokens dos exemplos são fictícios.

    Todos os perfis ativos leem módulos core. CHEFE gerencia membros, cargos, atividades, modelos e contatos; membros editam seu próprio perfil. Checklists são executados pelo responsável ou CHEFE. Tarefas próprias podem ser criadas por todos; CHEFE atribui inicialmente a terceiros. Criador/CHEFE edita, reatribui e cancela; responsável/CHEFE inicia e conclui.

    Validações de negócio: normalização de e-mail/tags e telefone válido; datas civis suportadas; frequência PERSONALIZADA exige detalhes; intervalos de prazo válidos; transições restritas; checklist vinculado concluído antes da tarefa e sem reabertura depois. Os schemas gerados descrevem estruturas; refinements Zod e serviços são a validação executável completa.

    Listagens retornam items e nextCursor, limite padrão 20 e máximo 100. Cursor de tarefas é opaco e composto; demais cursors usam id. DELETE desativa/cancela/arquiva preservando históricos. Erros usam {error:{code,message,details?}}. Corpo JSON máximo 1 MB. TLS é fornecido pelo ambiente de publicação.
paths:
  /auth/me:
    get:
      summary: Consulta usuário e permissões atuais
      operationId: currentAccess
      description: Valida JWT e consulta sessão e usuário no banco a cada chamada; perfil do token não concede permissões.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Acesso atual; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccess"
              examples:
                ficticio:
                  externalValue: ./examples/current-access.json
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Autenticação
  /users/{id}/permissions:
    get:
      summary: Consulta administrativa das permissões de um usuário
      operationId: userPermissions
      description: Exige perfil CHEFE e permissão team:manage, também verificada no service. Não é a listagem geral da equipe.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Permissões do usuário consultado; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPermissions"
              examples:
                ficticio:
                  externalValue: ./examples/user-permissions.json
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Perfil sem permissão (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Usuário não encontrado (USER_NOT_FOUND); somente após autorização
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Equipe
  /auth/refresh:
    post:
      summary: Renova a sessão e consome o refresh token anterior
      description: Rotação atômica com prazo absoluto de sete dias desde o login. Reutilização revoga toda a sessão. Limite de 60 tentativas por IP em 15 minutos.
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            examples:
              ficticio:
                value:
                  refreshToken: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        "200":
          description: Novos tokens de acesso e renovação; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
              examples:
                ficticio:
                  externalValue: ./examples/refresh-success.json
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          description: Token inexistente, consumido, revogado, expirado ou usuário inativo (INVALID_REFRESH_TOKEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Autenticação
  /auth/logout:
    post:
      summary: Revoga a sessão identificada pelo refresh token
      description: Idempotente; token inexistente ou sessão já revogada também retorna 204. Outras sessões permanecem ativas. Limite de 120 tentativas por IP em 15 minutos.
      operationId: logoutSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
            examples:
              ficticio:
                value:
                  refreshToken: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        "204":
          description: Sessão revogada; sem corpo; Cache-Control no-store
        "400":
          $ref: "#/components/responses/InvalidInput"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Autenticação
  /auth/login:
    post:
      summary: Autentica usuário ativo e emite token de acesso
      description: Credenciais inválidas e usuário desativado retornam a mesma resposta. Limite de 20 tentativas por IP a cada 15 minutos.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              ficticio:
                value:
                  email: assessor1@example.invalid
                  password: Senha-ficticia-minimo-12
      responses:
        "200":
          description: Login válido; resposta com Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                ficticio:
                  externalValue: ./examples/login-success.json
        "400":
          description: Entrada inválida (VALIDATION_ERROR) ou JSON malformado (INVALID_JSON)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Credenciais inválidas ou usuário desativado (INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Corpo excede 1 MB (BODY_TOO_LARGE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Limite de tentativas excedido (AUTH_RATE_LIMITED)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Segundos até a próxima tentativa permitida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Falha interna (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      tags:
        - Autenticação
  /health:
    get:
      summary: Verifica disponibilidade do processo da API
      description: Público; não testa conexão com banco nem garante prontidão dos módulos.
      operationId: health
      security: []
      responses:
        "200":
          description: Processo disponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ficticio:
                  externalValue: ./examples/health-response.json
      tags:
        - Saúde
  /users:
    get:
      operationId: listUsers
      summary: Consulta equipe paginada para todos os perfis
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta pública; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
              examples:
                ficticio:
                  externalValue: ./examples/user-page.json
        "400": &a23
          $ref: "#/components/responses/InvalidInput"
        "401": &a24
          $ref: "#/components/responses/Unauthenticated"
        "403": &a25
          description: Sem permissão (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500": &a26
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: limit
          in: query
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: role
          in: query
          schema:
            type: string
            enum:
              - CHEFE
              - ASSESSOR
              - APOIO
        - name: isActive
          in: query
          schema:
            type: string
            enum:
              - "true"
              - "false"
      tags:
        - Equipe
    post:
      operationId: createUser
      summary: Cadastro administrativo somente pela chefia
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Resposta pública; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
              examples:
                ficticio:
                  externalValue: ./examples/user-detail.json
          headers:
            Location:
              schema:
                type: string
        "400": *a23
        "401": *a24
        "403": *a25
        "409":
          description: EMAIL_ALREADY_EXISTS ou LAST_ACTIVE_CHIEF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500": *a26
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
            examples:
              ficticio:
                value:
                  name: Pessoa Fictícia
                  email: nova@example.invalid
                  password: Senha-ficticia-minimo-12
                  position: ASSESSOR
      tags:
        - Equipe
  /users/{id}:
    get:
      operationId: getUser
      summary: Consulta detalhe público de membro
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta pública; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
              examples:
                ficticio:
                  externalValue: ./examples/user-detail.json
        "400": &a27
          $ref: "#/components/responses/InvalidInput"
        "401": &a28
          $ref: "#/components/responses/Unauthenticated"
        "403": &a29
          description: Sem permissão (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500": &a30
          $ref: "#/components/responses/InternalError"
      parameters:
        - &a31
          name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      tags:
        - Equipe
    patch:
      operationId: updateUser
      summary: Edita nome/e-mail de membro; somente chefia
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta pública; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
              examples:
                ficticio:
                  externalValue: ./examples/user-detail.json
        "400": *a27
        "401": *a28
        "403": *a29
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: EMAIL_ALREADY_EXISTS ou LAST_ACTIVE_CHIEF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500": *a30
      parameters:
        - *a31
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfile"
            examples:
              ficticio:
                value: &a34
                  name: Pessoa Atualizada
      tags:
        - Equipe
    delete:
      operationId: deactivateUser
      summary: Desativa e revoga sessões; não apaga pessoa ou histórico
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Desativação idempotente; sem corpo
        "400": *a27
        "401": *a28
        "403": *a29
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: LAST_ACTIVE_CHIEF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500": *a30
      parameters:
        - *a31
      tags:
        - Equipe
  /users/me:
    patch:
      operationId: updateOwnProfile
      summary: Edita somente nome/e-mail do próprio usuário
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta pública; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
              examples:
                ficticio:
                  externalValue: ./examples/user-detail.json
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Sem permissão (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: EMAIL_ALREADY_EXISTS ou LAST_ACTIVE_CHIEF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfile"
            examples:
              ficticio:
                value: *a34
      tags:
        - Equipe
  /users/{id}/position:
    patch:
      operationId: changeUserPosition
      summary: Altera cargo com histórico e perfil derivado; somente chefia
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta pública; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
              examples:
                ficticio:
                  externalValue: ./examples/user-detail.json
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Sem permissão (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: EMAIL_ALREADY_EXISTS ou LAST_ACTIVE_CHIEF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePosition"
            examples:
              ficticio:
                value:
                  position: APOIO
      tags:
        - Equipe
  /users/{id}/positions:
    get:
      operationId: listUserPositions
      summary: Consulta histórico paginado de cargos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta pública; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionPage"
              examples:
                ficticio:
                  externalValue: ./examples/position-page.json
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Sem permissão (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: limit
          in: query
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 128
      tags:
        - Equipe
  /routines:
    get:
      operationId: listRoutines
      summary: Consulta atividades paginadas; arquivadas excluídas por padrão
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutinePage"
              examples:
                ficticio:
                  externalValue: ./examples/routine-page.json
        "400": &a35
          $ref: "#/components/responses/InvalidInput"
        "401": &a36
          $ref: "#/components/responses/Unauthenticated"
        "403": &a37
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500": &a38
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: limit
          in: query
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: isArchived
          in: query
          schema:
            default: "false"
            type: string
            enum:
              - "true"
              - "false"
        - name: frequency
          in: query
          schema:
            type: string
            enum:
              - DIARIA
              - SEMANAL
              - QUINZENAL
              - MENSAL
              - EVENTUAL
              - PERSONALIZADA
              - A_DEFINIR
        - name: category
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: defaultPosition
          in: query
          schema:
            type: string
            enum:
              - MAGISTRADO_GESTOR
              - ASSESSOR_CHEFE
              - ASSESSOR
              - APOIO
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
      tags:
        - Atividades
    post:
      operationId: createRoutine
      summary: Cadastra atividade; somente chefia
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Resposta; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
              examples:
                ficticio:
                  externalValue: ./examples/routine.json
          headers:
            Location:
              schema:
                type: string
        "400": *a35
        "401": *a36
        "403": *a37
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500": *a38
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoutine"
            examples:
              ficticio:
                value:
                  title: Atividade fictícia
                  category: Administrativo
                  frequency: DIARIA
                  steps:
                    - Conferir expediente
      tags:
        - Atividades
  /routines/{id}:
    get:
      operationId: getRoutine
      summary: Consulta detalhe de atividade ativa ou arquivada
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
              examples:
                ficticio:
                  externalValue: ./examples/routine.json
        "400": &a39
          $ref: "#/components/responses/InvalidInput"
        "401": &a40
          $ref: "#/components/responses/Unauthenticated"
        "403": &a41
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ROUTINE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500": &a42
          $ref: "#/components/responses/InternalError"
      parameters:
        - &a43
          name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      tags:
        - Atividades
    patch:
      operationId: updateRoutine
      summary: Edita atividade; somente chefia
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
              examples:
                ficticio:
                  externalValue: ./examples/routine.json
        "400": *a39
        "401": *a40
        "403": *a41
        "404":
          description: ROUTINE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: ROUTINE_ARCHIVED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500": *a42
      parameters:
        - *a43
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoutine"
            examples:
              ficticio:
                value:
                  title: Atividade atualizada
      tags:
        - Atividades
    delete:
      operationId: archiveRoutine
      summary: Arquiva sem apagar; idempotente; somente chefia
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Arquivada; sem corpo
        "400": *a39
        "401": *a40
        "403": *a41
        "404":
          description: ROUTINE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500": *a42
      parameters:
        - *a43
      tags:
        - Atividades
  /checklists/templates:
    get:
      operationId: listChecklistTemplates
      summary: Lista modelos paginados
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTemplatePage"
              examples:
                ficticio:

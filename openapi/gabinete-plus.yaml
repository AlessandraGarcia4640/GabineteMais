    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
          minLength: 1
        refreshToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        refreshExpiresAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: number
          const: 900
        user:
          type: object
          properties:
            id:
              type: string
              minLength: 1
            name:
              type: string
              minLength: 1
            email:
              type: string
              format: email
              pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            role:
              type: string
              enum:
                - CHEFE
                - ASSESSOR
                - APOIO
            isActive:
              type: boolean
          required:
            - id
            - name
            - email
            - role
            - isActive
      required:
        - accessToken
        - refreshToken
        - refreshExpiresAt
        - tokenType
        - expiresIn
        - user
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
      required:
        - refreshToken
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: gabinete-plus-api
        timestamp:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - status
        - service
        - timestamp

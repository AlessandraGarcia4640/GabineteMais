          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
              taskId:
                type: string
                minLength: 1
                maxLength: 128
              actorId:
                type: string
                minLength: 1
                maxLength: 128
              type:
                type: string
                enum:
                  - CREATED
                  - EDITED
                  - REASSIGNED
                  - STATUS_CHANGED
              fromStatus:
                anyOf:
                  - type: string
                    enum:
                      - ABERTA
                      - EM_ANDAMENTO
                      - CONCLUIDA
                      - CANCELADA
                  - type: "null"
              toStatus:
                anyOf:
                  - type: string
                    enum:
                      - ABERTA
                      - EM_ANDAMENTO
                      - CONCLUIDA
                      - CANCELADA
                  - type: "null"

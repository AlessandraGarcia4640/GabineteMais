components:
  responses:
    Unauthenticated:
      description: Token ausente/inválido, sessão encerrada/expirada ou usuário desativado (UNAUTHENTICATED)
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            ficticio:
              value:
                error:
                  code: UNAUTHENTICATED
                  message: Sessão inválida. Entre novamente.
    InvalidInput:
      description: Entrada inválida (VALIDATION_ERROR) ou JSON malformado (INVALID_JSON)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            ficticio:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Dados inválidos.
                  details:
                    errors: []
                    properties:
                      title:
                        errors:
                          - Informe um título.
    BodyTooLarge:
      description: Corpo excede 1 MB (BODY_TOO_LARGE)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            ficticio:
              value:
                error:
                  code: BODY_TOO_LARGE
                  message: Os dados excedem o limite permitido.
    AuthRateLimited:
      description: Limite de tentativas excedido (AUTH_RATE_LIMITED)
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos até a próxima tentativa
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            ficticio:
              value:
                error:
                  code: AUTH_RATE_LIMITED
                  message: Muitas tentativas. Tente novamente mais tarde.
    InternalError:
      description: Falha interna (INTERNAL_ERROR)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            ficticio:
              value:
                error:
                  code: INTERNAL_ERROR
                  message: Erro interno do servidor.
    TaskNotFound:
      description: Registro não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            ficticio:
              value:
                error:
                  code: TASK_NOT_FOUND
                  message: Tarefa não encontrada.
    TaskConflict:
      description: Conflito de regra de negócio
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            ficticio:
              value:
                error:
                  code: TASK_INVALID_TRANSITION
                  message: Transição de status não permitida.
    Forbidden:
      description: Operação não autorizada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            ficticio:
              value:
                error:
                  code: FORBIDDEN
                  message: Você não tem permissão para esta operação.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Informe accessToken emitido pelo login, sem prefixo Bearer no campo Authorize. Validade 900 segundos; perfil e sessão atuais são revalidados no banco.
  schemas:
    Permission:
      type: string
      enum:
        - team:read
        - activities:read
        - tasks:read
        - contacts:read
        - guidelines:read
        - profile:update-self
        - tasks:execute-assigned
        - team:manage
        - activities:manage
        - contacts:manage
        - guidelines:manage
        - tasks:assign
        - substitutions:manage
        - checklists:read
        - checklists:manage
        - checklists:execute-assigned
    CurrentAccess:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              minLength: 1
            name:
              type: string
              minLength: 1
            email:
              type: string
              format: email
              pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            role:
              type: string
              enum:
                - CHEFE
                - ASSESSOR
                - APOIO
            isActive:
              type: boolean
          required:
            - id
            - name
            - email
            - role
            - isActive
        permissions:
          type: array
          items:
            type: string
            enum:
              - team:read
              - activities:read
              - tasks:read
              - contacts:read
              - guidelines:read
              - profile:update-self
              - tasks:execute-assigned
              - team:manage
              - activities:manage
              - contacts:manage
              - guidelines:manage
              - tasks:assign
              - substitutions:manage
              - checklists:read
              - checklists:manage
              - checklists:execute-assigned
      required:
        - user
        - permissions
    UserPermissions:
      type: object
      properties:
        userId:
          type: string
          minLength: 1
        role:
          type: string
          enum:
            - CHEFE
            - ASSESSOR
            - APOIO
        isActive:
          type: boolean
        permissions:
          type: array
          items:
            type: string
            enum:
              - team:read
              - activities:read
              - tasks:read
              - contacts:read
              - guidelines:read
              - profile:update-self
              - tasks:execute-assigned
              - team:manage
              - activities:manage
              - contacts:manage
              - guidelines:manage
              - tasks:assign
              - substitutions:manage
              - checklists:read
              - checklists:manage
              - checklists:execute-assigned
      required:
        - userId
        - role
        - isActive
        - permissions
    UserRole:
      type: string
      enum:
        - CHEFE
        - ASSESSOR
        - APOIO
    UserPosition:
      type: string
      enum:
        - MAGISTRADO_GESTOR
        - ASSESSOR_CHEFE
        - ASSESSOR
        - APOIO
    UserSummary:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        role:
          type: string
          enum:
            - CHEFE
            - ASSESSOR
            - APOIO
        isActive:
          type: boolean
      required:
        - id
        - name
        - email
        - role
        - isActive
    UserPositionHistory:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        userId:
          type: string
          minLength: 1
        position:
          type: string
          enum:
            - MAGISTRADO_GESTOR
            - ASSESSOR_CHEFE
            - ASSESSOR
            - APOIO
        role:
          type: string
          enum:
            - CHEFE
            - ASSESSOR
            - APOIO
        startedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        endedAt:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: "null"
      required:
        - id
        - userId
        - position
        - role
        - startedAt
        - endedAt
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - email
        - password
      additionalProperties: false
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          minLength: 1
        refreshToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        refreshExpiresAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: number
          const: 900
        user:
          type: object
          properties:
            id:
              type: string
              minLength: 1
            name:
              type: string
              minLength: 1
            email:
              type: string
              format: email
              pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            role:
              type: string
              enum:
                - CHEFE
                - ASSESSOR
                - APOIO
            isActive:
              type: boolean
          required:
            - id
            - name
            - email
            - role
            - isActive
      required:
        - accessToken
        - refreshToken
        - refreshExpiresAt
        - tokenType
        - expiresIn
        - user
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
      required:
        - refreshToken
      additionalProperties: false
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1
            details:
              $ref: "#/components/schemas/ApiError/$defs/__schema0"
          required:
            - code
            - message
      required:
        - error
      $defs:
        __schema0:
          anyOf:
            - type: string
            - type: number
            - type: boolean
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/ApiError/$defs/__schema0"
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/ApiError/$defs/__schema0"
    UserDetail:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        role:
          type: string
          enum:
            - CHEFE
            - ASSESSOR
            - APOIO
        isActive:
          type: boolean
        position:
          anyOf:
            - type: string
              enum:
                - MAGISTRADO_GESTOR
                - ASSESSOR_CHEFE
                - ASSESSOR
                - APOIO
            - type: "null"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - name
        - email
        - role
        - isActive
        - position
        - createdAt
        - updatedAt
    CreateUser:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
        position:
          type: string
          enum:
            - MAGISTRADO_GESTOR
            - ASSESSOR_CHEFE
            - ASSESSOR
            - APOIO
      required:
        - name
        - email
        - password
        - position
      additionalProperties: false
    UpdateProfile:
      type: object
      properties:

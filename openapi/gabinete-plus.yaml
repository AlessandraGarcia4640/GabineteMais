openapi: 3.1.0
info:
  title: Gabinete+ API
  version: 0.1.0
paths:
  /auth/refresh:
    post:
      summary: Renova a sessão e consome o refresh token anterior
      description: Rotação atômica com prazo absoluto de sete dias desde o login. Reutilização revoga toda a sessão. Limite de 60 tentativas por IP em 15 minutos.
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Novos tokens de acesso e renovação; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              examples:
                ficticio: { externalValue: ./examples/refresh-success.json }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401':
          description: Token inexistente, consumido, revogado, expirado ou usuário inativo (INVALID_REFRESH_TOKEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/logout:
    post:
      summary: Revoga a sessão identificada pelo refresh token
      description: Idempotente; token inexistente ou sessão já revogada também retorna 204. Outras sessões permanecem ativas. Limite de 120 tentativas por IP em 15 minutos.
      operationId: logoutSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204':
          description: Sessão revogada; sem corpo; Cache-Control no-store
        '400': { $ref: '#/components/responses/InvalidInput' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/login:
    post:
      summary: Autentica usuário ativo e emite token de acesso
      description: Credenciais inválidas e usuário desativado retornam a mesma resposta. Limite de 20 tentativas por IP a cada 15 minutos.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login válido; resposta com Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              examples:
                ficticio:
                  externalValue: ./examples/login-success.json
        '400':
          description: Entrada inválida (VALIDATION_ERROR) ou JSON malformado (INVALID_JSON)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Credenciais inválidas ou usuário desativado (INVALID_CREDENTIALS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '413':
          description: Corpo excede 1 MB (BODY_TOO_LARGE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          description: Limite de tentativas excedido (AUTH_RATE_LIMITED)
          headers:
            Retry-After:
              schema: { type: integer }
              description: Segundos até a próxima tentativa permitida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500':
          description: Falha interna (INTERNAL_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /health:
    get:
      summary: Verifica o estado da API
      responses:
        "200":
          description: API disponível
components:
  responses:
    InvalidInput:
      description: Entrada inválida (VALIDATION_ERROR) ou JSON malformado (INVALID_JSON)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BodyTooLarge:
      description: Corpo excede 1 MB (BODY_TOO_LARGE)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    AuthRateLimited:
      description: Limite de tentativas excedido (AUTH_RATE_LIMITED)
      headers:
        Retry-After: { schema: { type: integer }, description: Segundos até a próxima tentativa }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InternalError:
      description: Falha interna (INTERNAL_ERROR)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserRole:
      type: string
      enum: [CHEFE, ASSESSOR, APOIO]
    UserPosition:
      type: string
      enum: [MAGISTRADO_GESTOR, ASSESSOR_CHEFE, ASSESSOR, APOIO]
    UserSummary:
      type: object
      required: [id, name, email, role, isActive]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        isActive: { type: boolean }
    UserPositionHistory:
      type: object
      description: Histórico de cargo; endedAt, quando preenchido, deve ser posterior a startedAt.
      required: [id, userId, position, role, startedAt, endedAt]
      properties:
        id: { type: string, minLength: 1 }
        userId: { type: string, minLength: 1 }
        position: { $ref: '#/components/schemas/UserPosition' }
        role: { $ref: '#/components/schemas/UserRole' }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
    LoginRequest:
      description: E-mail sem espaços nas extremidades; consulta exata, sem conversão de maiúsculas. Perfis e permissões não são aceitos na entrada.
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, refreshExpiresAt, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string, minLength: 1 }
        refreshToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        refreshExpiresAt: { type: string, format: date-time, description: Prazo absoluto da sessão; não muda com a rotação }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, const: 900 }
        user: { $ref: '#/components/schemas/UserSummary' }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, minLength: 1 }
            message: { type: string, minLength: 1 }
            details: { description: Detalhes opcionais de validação }

openapi: 3.1.0
info:
  title: Gabinete+ API
  version: 0.1.0
paths:
  /auth/me:
    get:
      summary: Consulta usuário e permissões atuais
      operationId: currentAccess
      description: Valida JWT e consulta sessão e usuário no banco a cada chamada; perfil do token não concede permissões.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Acesso atual; Cache-Control no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentAccess'}
              examples:
                ficticio: {externalValue: ./examples/current-access.json}
        '400': {$ref: '#/components/responses/InvalidInput'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/{id}/permissions:
    get:
      summary: Consulta administrativa das permissões de um usuário
      operationId: userPermissions
      description: Exige perfil CHEFE e permissão team:manage, também verificada no service. Não é a listagem geral da equipe.
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200':
          description: Permissões do usuário consultado; Cache-Control no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPermissions'}
        '400': {$ref: '#/components/responses/InvalidInput'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: Perfil sem permissão (FORBIDDEN)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '404':
          description: Usuário não encontrado (USER_NOT_FOUND); somente após autorização
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/refresh:
    post:
      summary: Renova a sessão e consome o refresh token anterior
      description: Rotação atômica com prazo absoluto de sete dias desde o login. Reutilização revoga toda a sessão. Limite de 60 tentativas por IP em 15 minutos.
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: Novos tokens de acesso e renovação; Cache-Control no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
              examples:
                ficticio: {externalValue: ./examples/refresh-success.json}
        '400': {$ref: '#/components/responses/InvalidInput'}
        '401':
          description: Token inexistente, consumido, revogado, expirado ou usuário inativo (INVALID_REFRESH_TOKEN)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '429': {$ref: '#/components/responses/AuthRateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/logout:
    post:
      summary: Revoga a sessão identificada pelo refresh token
      description: Idempotente; token inexistente ou sessão já revogada também retorna 204. Outras sessões permanecem ativas. Limite de 120 tentativas por IP em 15 minutos.
      operationId: logoutSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '204':
          description: Sessão revogada; sem corpo; Cache-Control no-store
        '400': {$ref: '#/components/responses/InvalidInput'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '429': {$ref: '#/components/responses/AuthRateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/login:
    post:
      summary: Autentica usuário ativo e emite token de acesso
      description: Credenciais inválidas e usuário desativado retornam a mesma resposta. Limite de 20 tentativas por IP a cada 15 minutos.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Login válido; resposta com Cache-Control no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
              examples:
                ficticio:
                  externalValue: ./examples/login-success.json
        '400':
          description: Entrada inválida (VALIDATION_ERROR) ou JSON malformado (INVALID_JSON)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '401':
          description: Credenciais inválidas ou usuário desativado (INVALID_CREDENTIALS)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '413':
          description: Corpo excede 1 MB (BODY_TOO_LARGE)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '429':
          description: Limite de tentativas excedido (AUTH_RATE_LIMITED)
          headers:
            Retry-After:
              schema: {type: integer}
              description: Segundos até a próxima tentativa permitida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '500':
          description: Falha interna (INTERNAL_ERROR)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /health:
    get:
      summary: Verifica o estado da API
      responses:
        "200":
          description: API disponível
  /users:
    get:
      operationId: listUsers
      summary: Consulta equipe paginada para todos os perfis
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta pública; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400": &a1
          $ref: "#/components/responses/InvalidInput"
        "401": &a2
          $ref: "#/components/responses/Unauthenticated"
        "403": &a3
          description: Sem permissão (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500": &a4
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: ID retornado em nextCursor; ordenação crescente por id
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
        - name: isActive
          in: query
          schema:
            type: string
            enum:
              - "true"
              - "false"
    post:
      operationId: createUser
      summary: Cadastro administrativo somente pela chefia
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Resposta pública; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
          headers:
            Location:
              schema:
                type: string
        "400": *a1
        "401": *a2
        "403": *a3
        "409":
          description: EMAIL_ALREADY_EXISTS ou LAST_ACTIVE_CHIEF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500": *a4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
  /users/{id}:
    get:
      operationId: getUser
      summary: Consulta detalhe público de membro
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta pública; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400": &a1
          $ref: "#/components/responses/InvalidInput"
        "401": &a2
          $ref: "#/components/responses/Unauthenticated"
        "403": &a3
          description: Sem permissão (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500": &a4
          $ref: "#/components/responses/InternalError"
      parameters:
        - &a5
          name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
    patch:
      operationId: updateUser
      summary: Edita nome/e-mail de membro; somente chefia
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta pública; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400": *a1
        "401": *a2
        "403": *a3
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: EMAIL_ALREADY_EXISTS ou LAST_ACTIVE_CHIEF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500": *a4
      parameters:
        - *a5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfile"
    delete:
      operationId: deactivateUser
      summary: Desativa e revoga sessões; não apaga pessoa ou histórico
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Desativação idempotente; sem corpo
        "400": *a1
        "401": *a2
        "403": *a3
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: LAST_ACTIVE_CHIEF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500": *a4
      parameters:
        - *a5
  /users/me:
    patch:
      operationId: updateOwnProfile
      summary: Edita somente nome/e-mail do próprio usuário
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta pública; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Sem permissão (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: EMAIL_ALREADY_EXISTS ou LAST_ACTIVE_CHIEF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfile"
  /users/{id}/position:
    patch:
      operationId: changeUserPosition
      summary: Altera cargo com histórico e perfil derivado; somente chefia
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta pública; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Sem permissão (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: EMAIL_ALREADY_EXISTS ou LAST_ACTIVE_CHIEF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePosition"
  /users/{id}/positions:
    get:
      operationId: listUserPositions
      summary: Consulta histórico paginado de cargos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta pública; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionPage"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Sem permissão (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: ID retornado em nextCursor; ordenação crescente por id
  /routines:
    get:
      operationId: listRoutines
      summary: Consulta atividades paginadas; arquivadas excluídas por padrão
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutinePage"
        "400": &a6
          $ref: "#/components/responses/InvalidInput"
        "401": &a7
          $ref: "#/components/responses/Unauthenticated"
        "403": &a8
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500": &a9
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: isArchived
          in: query
          schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "false"
        - name: frequency
          in: query
          schema:
            type: string
            enum:
              - DIARIA
              - SEMANAL
              - QUINZENAL
              - MENSAL
              - EVENTUAL
              - PERSONALIZADA
              - A_DEFINIR
        - name: category
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: defaultPosition
          in: query
          schema:
            $ref: "#/components/schemas/UserPosition"
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Busca por título/descrição
    post:
      operationId: createRoutine
      summary: Cadastra atividade; somente chefia
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Resposta; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
              examples:
                ficticio:
                  externalValue: ./examples/routine.json
          headers:
            Location:
              schema:
                type: string
        "400": *a6
        "401": *a7
        "403": *a8
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500": *a9
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoutine"
  /routines/{id}:
    get:
      operationId: getRoutine
      summary: Consulta detalhe de atividade ativa ou arquivada
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
        "400": &a6
          $ref: "#/components/responses/InvalidInput"
        "401": &a7
          $ref: "#/components/responses/Unauthenticated"
        "403": &a8
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ROUTINE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500": &a9
          $ref: "#/components/responses/InternalError"
      parameters:
        - &a10
          name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
    patch:
      operationId: updateRoutine
      summary: Edita atividade; somente chefia
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
        "400": *a6
        "401": *a7
        "403": *a8
        "404":
          description: ROUTINE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: ROUTINE_ARCHIVED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500": *a9
      parameters:
        - *a10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoutine"
    delete:
      operationId: archiveRoutine
      summary: Arquiva sem apagar; idempotente; somente chefia
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Arquivada; sem corpo
        "400": *a6
        "401": *a7
        "403": *a8
        "404":
          description: ROUTINE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500": *a9
      parameters:
        - *a10
  /checklists/templates:
    get:
      operationId: listChecklistTemplates
      summary: Lista modelos paginados
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTemplatePage"
        "400": &a12
          $ref: "#/components/responses/InvalidInput"
        "401": &a13
          $ref: "#/components/responses/Unauthenticated"
        "403": &a14
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404": &a15
          description: Registro não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409": &a16
          description: Modelo/atividade arquivados, responsável inativo ou período com outro responsável
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500": &a17
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema: &a11
            type: string
            minLength: 1
            maxLength: 128
        - name: routineId
          in: query
          schema: *a11
        - name: isArchived
          in: query
          schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "false"
    post:
      operationId: createChecklistTemplate
      summary: Cria modelo; chefia
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Resposta; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTemplate"
        "400": *a12
        "401": *a13
        "403": *a14
        "404": *a15
        "409": *a16
        "500": *a17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChecklist"
  /checklists/templates/{id}:
    get:
      operationId: getChecklistTemplate
      summary: Consulta modelo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTemplate"
        "400": &a11
          $ref: "#/components/responses/InvalidInput"
        "401": &a12
          $ref: "#/components/responses/Unauthenticated"
        "403": &a13
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404": &a14
          description: Registro não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409": &a15
          description: Modelo/atividade arquivados, responsável inativo ou período com outro responsável
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500": &a16
          $ref: "#/components/responses/InternalError"
      parameters:
        - &a17
          name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
    patch:
      operationId: updateChecklistTemplate
      summary: Edita e incrementa versão; execuções antigas não mudam
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTemplate"
        "400": *a11
        "401": *a12
        "403": *a13
        "404": *a14
        "409": *a15
        "500": *a16
      parameters:
        - *a17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChecklist"
    delete:
      operationId: archiveChecklistTemplate
      summary: Arquiva modelo sem apagar execuções; chefia
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Arquivado; sem corpo
        "400": *a11
        "401": *a12
        "403": *a13
        "404": *a14
        "409": *a15
        "500": *a16
      parameters:
        - *a17
  /checklists/templates/{id}/runs:
    post:
      operationId: startChecklistRun
      summary: Inicia período; reutiliza execução existente, sem reatribuir
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistRun"
        "201":
          description: Execução criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistRun"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Registro não encontrado
          content:
            application/json:
              schema:

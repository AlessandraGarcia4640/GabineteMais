        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RoutinePage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Routine"
        nextCursor:
          type:
            - string
            - "null"
    CreateChecklist:

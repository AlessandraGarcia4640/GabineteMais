components:
  responses:
    Unauthenticated:
      description: Token ausente/inválido, sessão encerrada/expirada ou usuário desativado (UNAUTHENTICATED)
      headers:
        WWW-Authenticate: {schema: {type: string, const: Bearer}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    InvalidInput:
      description: Entrada inválida (VALIDATION_ERROR) ou JSON malformado (INVALID_JSON)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    BodyTooLarge:
      description: Corpo excede 1 MB (BODY_TOO_LARGE)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    AuthRateLimited:
      description: Limite de tentativas excedido (AUTH_RATE_LIMITED)
      headers:
        Retry-After: {schema: {type: integer}, description: Segundos até a próxima tentativa}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    InternalError:
      description: Falha interna (INTERNAL_ERROR)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Permission:
      type: string
      enum:
        - team:read
        - activities:read
        - tasks:read
        - contacts:read
        - guidelines:read
        - profile:update-self
        - tasks:execute-assigned
        - team:manage
        - activities:manage
        - contacts:manage
        - guidelines:manage
        - tasks:assign
        - substitutions:manage
        - checklists:read
        - checklists:manage
        - checklists:execute-assigned
    CurrentAccess:
      type: object
      required: [user, permissions]
      properties:
        user: {$ref: '#/components/schemas/UserSummary'}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}
    UserPermissions:
      type: object
      required: [userId, role, isActive, permissions]
      properties:
        userId: {type: string, minLength: 1}
        role: {$ref: '#/components/schemas/UserRole'}
        isActive: {type: boolean}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}
    UserRole:
      type: string
      enum: [CHEFE, ASSESSOR, APOIO]
    UserPosition:
      type: string
      enum: [MAGISTRADO_GESTOR, ASSESSOR_CHEFE, ASSESSOR, APOIO]
    UserSummary:
      type: object
      required: [id, name, email, role, isActive]
      properties:
        id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/UserRole'}
        isActive: {type: boolean}
    UserPositionHistory:
      type: object
      description: Histórico de cargo; endedAt, quando preenchido, deve ser posterior a startedAt.
      required: [id, userId, position, role, startedAt, endedAt]
      properties:
        id: {type: string, minLength: 1}
        userId: {type: string, minLength: 1}
        position: {$ref: '#/components/schemas/UserPosition'}
        role: {$ref: '#/components/schemas/UserRole'}
        startedAt: {type: string, format: date-time}
        endedAt: {type: [string, 'null'], format: date-time}
    LoginRequest:
      description: E-mail sem espaços nas extremidades; consulta sem distinguir maiúsculas/minúsculas. Perfis e permissões não são aceitos na entrada.
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 128, writeOnly: true}
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, refreshExpiresAt, tokenType, expiresIn, user]
      properties:
        accessToken: {type: string, minLength: 1}
        refreshToken: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        refreshExpiresAt: {type: string, format: date-time, description: Prazo absoluto da sessão; não muda com a rotação}
        tokenType: {type: string, const: Bearer}
        expiresIn: {type: integer, const: 900}
        user: {$ref: '#/components/schemas/UserSummary'}
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: {type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true}
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, minLength: 1}
            message: {type: string, minLength: 1}
            details: {description: Detalhes opcionais de validação}
    UserDetail:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          required:
            - position
            - createdAt
            - updatedAt
          properties:
            position:
              anyOf:
                - $ref: "#/components/schemas/UserPosition"
                - type: "null"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    CreateUser:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
        - position
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
          description: Normalizado em minúsculas
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        position:
          $ref: "#/components/schemas/UserPosition"
    UpdateProfile:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
          description: Normalizado em minúsculas
    ChangePosition:
      type: object
      additionalProperties: false
      required:
        - position
      properties:
        position:
          $ref: "#/components/schemas/UserPosition"
    UserPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/UserDetail"
        nextCursor:
          type:
            - string
            - "null"
    PositionPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/UserPositionHistory"
        nextCursor:
          type:
            - string
            - "null"
    CreateRoutine:
      type: object
      additionalProperties: false
      required:
        - title
        - category
        - frequency
      description: PERSONALIZADA exige frequencyDetails não nulo. Campos omitidos recebem valores vazios/null/false.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 100
        frequency:
          type: string
          enum:
            - DIARIA
            - SEMANAL
            - QUINZENAL
            - MENSAL
            - EVENTUAL
            - PERSONALIZADA
            - A_DEFINIR
        description:
          type: string
          maxLength: 4000
        instructions:
          type: string
          maxLength: 12000
        steps:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 500
        frequencyDetails:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 2000
        specificDate:
          type:
            - string
            - "null"
          format: date
        defaultPosition:
          anyOf:
            - $ref: "#/components/schemas/UserPosition"
            - type: "null"
        essentialForTransition:
          type: boolean
    UpdateRoutine:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Validação considera os dados atuais e o patch; autoria/status não são aceitos.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 100
        frequency:
          type: string
          enum:
            - DIARIA
            - SEMANAL
            - QUINZENAL
            - MENSAL
            - EVENTUAL
            - PERSONALIZADA
            - A_DEFINIR
        description:
          type: string
          maxLength: 4000
        instructions:
          type: string
          maxLength: 12000
        steps:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 500
        frequencyDetails:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 2000
        specificDate:
          type:
            - string
            - "null"
          format: date
        defaultPosition:
          anyOf:
            - $ref: "#/components/schemas/UserPosition"
            - type: "null"
        essentialForTransition:
          type: boolean
    Routine:
      type: object
      required:
        - title
        - category
        - frequency
        - description
        - instructions
        - steps
        - frequencyDetails
        - specificDate
        - defaultPosition
        - essentialForTransition
        - id
        - isArchived
        - createdById
        - updatedById
        - createdAt
        - updatedAt
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 100
        frequency:
          type: string
          enum:
            - DIARIA
            - SEMANAL
            - QUINZENAL
            - MENSAL
            - EVENTUAL
            - PERSONALIZADA
            - A_DEFINIR
        description:
          type: string
          maxLength: 4000
        instructions:
          type: string
          maxLength: 12000
        steps:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 500
        frequencyDetails:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 2000
        specificDate:
          type:
            - string
            - "null"
          format: date
        defaultPosition:
          anyOf:
            - $ref: "#/components/schemas/UserPosition"
            - type: "null"
        essentialForTransition:
          type: boolean
        id:
          type: string
          minLength: 1
        isArchived:
          type: boolean
        createdById:
          type: string
          minLength: 1
        updatedById:
          type: string
